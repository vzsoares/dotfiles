[tasks]
hello = "echo 'Hello from mise'"

[env]
_.file = ".env"
SHELL = "/bin/zsh"

[tool_alias]
m = "mise"

[tools]
go = "latest"
# Pinned to the 21 LTS line, not "latest": Gradle/AGP accept specific JDK
# majors, so a surprise major bump breaks Android builds.
java = "temurin-21"
bun = "latest"
deno = "latest"
node = "latest"
python = "latest"
rust = "latest"
usage = "latest"
watchexec = "latest"
awscli = { version = "latest", symlink_bins = "true" }
ripgrep = "latest"
fzf = "latest"
gitleaks = "latest"
lazygit = "latest"
lazydocker = "latest"
"aqua:jorgerojas26/lazysql" = "latest"
just = "latest"
lefthook = "latest"
jq = "latest"
terraform = "latest"
# Typst: single-binary typesetter for long-form docs (book/thesis) — see typst/
typst = "latest"
