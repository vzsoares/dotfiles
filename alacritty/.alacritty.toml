[font]
  normal = { family = "Hack Nerd Font", style = "Regular" }
  size = 16.0

[env]
  WINIT_X11_SCALE_FACTOR = "1.5"

[window]
  dimensions = { columns = 80, lines = 30 }
  dynamic_padding = true
  opacity = 1

[selection]
  save_to_clipboard = true

[bell]
  # Audible bell: anything emitting \a (long jobs, Claude Code, tmux passthrough)
  command = { program = "pw-play", args = ["--volume=0.4", "/usr/share/sounds/freedesktop/stereo/complete.oga"] }
  duration = 0

[terminal.shell]
    program = "/bin/zsh"

[[keyboard.bindings]]
    key = "NumpadEnter"
    chars = "\r"
