# macOS only — linked to ~/.config/alacritty/local.toml by ./link.

[window]
  # Make Option behave as Alt, so <M-...> mappings (e.g. Copilot's <M-Tab>)
  # reach tmux/nvim. Without this, Option composes characters and never sends
  # the ESC prefix. Use "OnlyLeft" instead if you want the right Option key to
  # keep composing accents (ó, ç).
  option_as_alt = "OnlyLeft"

[font]
  size = 16.0
