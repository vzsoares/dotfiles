; flameshot — screenshot tool with an on-canvas editor.
; Catppuccin Mocha, matching the wallpaper (pics/arch-mocha-base.jpg) and cava.
;
; NOTE: flameshot rewrites this file whenever a setting is changed from its GUI
; or tray menu (QSettings writes a temp file and renames it over the target),
; which replaces the symlink with a plain file. After tweaking anything in the
; GUI, copy the result back here and re-run ./link.

[General]
; --- appearance -------------------------------------------------------------
; uiColor drives the button ring; contrastUiColor is the selected/hover accent.
uiColor=#cba6f7
contrastUiColor=#89b4fa
; Dim of the area outside the selection (0-255).
contrastOpacity=188
drawColor=#f38ba8
drawThickness=3
drawFontSize=12
; Palette offered by the colour picker wheel.
userColors=picker, #f38ba8, #fab387, #f9e2af, #a6e3a1, #89b4fa, #cba6f7, #cdd6f4, #1e1e2e

; --- capture backend -------------------------------------------------------
; flameshot 14 captures through the xdg-desktop-portal Screenshot API by
; default. On bare i3 that never returns: the only portal backend installed is
; xdg-desktop-portal-gtk, whose Screenshot impl delegates to GNOME Shell's
; org.gnome.Shell.Screenshot, which does not exist here — every capture died
; with "Screenshot portal timed out after 30 seconds". This flag makes it use
; Qt's native X11 grab instead. Flameshot marks the option deprecated, so a
; future release may drop it; if captures start hanging again, that's why.
useX11LegacyScreenshot=true

; --- behaviour --------------------------------------------------------------
; Must be an absolute path. QSettings does no shell expansion, and flameshot
; does not expand it either — both `~/Pictures` and `$HOME/Pictures` make it
; crash (core dump) instead of falling back to a literal directory.
savePath=/home/zizmackrok/Pictures
; Always save to savePath instead of prompting for a location each time.
savePathFixed=true
saveAsFileExtension=png
; Filename pattern for saved shots.
filenamePattern=flameshot_%F_%H-%M-%S
copyPathAfterSave=true
; Keep the selection after copying so a second crop/annotation is possible.
copyOnDoubleClick=true
showDesktopNotification=true
showHelp=false
showSidePanelButton=true
showMagnifier=true
antialiasingPinZoom=true
useJpgForClipboard=false
; Bare i3 has a tray (nm-applet, pamac-tray) but the icon is redundant here —
; every entry point is a keybinding.
disabledTrayIcon=true
showStartupLaunchMessage=false

